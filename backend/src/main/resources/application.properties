server.port=8080
spring.application.name=medisphere-backend

# MongoDB connection
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/medisphere}
spring.data.mongodb.auto-index-creation=true

# Local/demo security foundation. Override these values outside development.
medisphere.security.username=${MEDISPHERE_DEMO_USERNAME:admin}
medisphere.security.password=${MEDISPHERE_DEMO_PASSWORD:medisphere-demo}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:medisphere-vitals}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.medisphere
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.LinkedHashMap
spring.kafka.listener.missing-topics-fatal=false
medisphere.kafka.vital-topic=${KAFKA_VITAL_TOPIC:vital-signs}
medisphere.kafka.careplan-topic=${KAFKA_CAREPLAN_TOPIC:careplan-events}
medisphere.alerts.cooldown-minutes=${MEDISPHERE_ALERT_COOLDOWN_MINUTES:15}

# Optional Milestone 2 AI service. Prediction endpoints return a controlled 503 when it is unavailable.
medisphere.ai.service-url=${AI_SERVICE_URL:http://localhost:8000}
medisphere.ai.connect-timeout-ms=${AI_SERVICE_CONNECT_TIMEOUT_MS:3000}
medisphere.ai.read-timeout-ms=${AI_SERVICE_READ_TIMEOUT_MS:15000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
